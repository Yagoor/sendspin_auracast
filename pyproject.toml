[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sendspin_auracast"
version = "0.2.2"
description = "Bridge Sendspin audio to Bluetooth LE Audio Auracast using Bumble."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Yago Fontoura do Rosario" },
]
keywords = ["sendspin_auracast"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "aiosendspin>=5.2.0",
  "bumble>=0.0.227",
  "lc3py>=1.1.3; python_version>='3.10' and ((platform_system=='Linux' and platform_machine=='x86_64') or (platform_system=='Darwin' and platform_machine=='arm64'))",
  "numpy>=2.0",
]

[project.scripts]
sendspin-auracast = "sendspin_auracast.client:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "pytest>=8.0",
  "ruff>=0.4",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Yagoor/sendspin_auracast"
Repository = "https://github.com/Yagoor/sendspin_auracast"
Issues = "https://github.com/Yagoor/sendspin_auracast/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sendspin_auracast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
